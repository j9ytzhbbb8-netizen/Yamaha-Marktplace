<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yamaha Peças - Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Courier+Prime:wght@700&display=swap');
    
    * {
      font-family: 'Inter', sans-serif;
    }
    
    .animate-in {
      animation: slideInRight 0.3s ease-out;
    }
    
    .slide-in-from-right {
      animation: slideInRight 0.3s ease-out;
    }
    
    @keyframes slideInRight {
      from {
        transform: translateX(100%);
      }
      to {
        transform: translateX(0);
      }
    }
    
    .zoom-in-95 {
      animation: zoomIn 0.2s ease-out;
    }
    
    @keyframes zoomIn {
      from {
        transform: scale(0.95);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }
    
    .animate-pulse {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body class="bg-gray-50 m-0 p-0">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const YamahaMarketplace = () => {
      const [products] = useState([
        { id: 1, name: 'Xmax 250 Correia da Embreagem', category: 'Xmax 250', price: 728, image: '🔧' },
        { id: 2, name: 'Filtro de Ar', category: 'Genérico', price: 280, image: '🌫️' },
        { id: 3, name: 'Kit Pastilha de Freio Dianteiro', category: 'Freios', price: 480, image: '🛑' },
        { id: 4, name: 'Kit Revisão Xmax', category: 'Xmax 250', price: 1500, image: '🔩' },
        { id: 5, name: 'Para Brisa Xmax', category: 'Xmax 250', price: 1800, image: '🪟' },
        { id: 6, name: 'Pneu Dianteiro Xmax Michelin', category: 'Pneus', price: 700, image: '⭕' },
        { id: 7, name: 'Factor Filtro de Ar', category: 'Factor', price: 140, image: '🌫️' },
        { id: 8, name: 'Kit Junta Superior', category: 'Genérico', price: 130, image: '⚙️' },
        { id: 9, name: 'Kit Lona de Freio Traseira', category: 'Freios', price: 70, image: '🛑' },
        { id: 10, name: 'Óleo Yamalube', category: 'Fluidos', price: 55, image: '🛢️' },
        { id: 11, name: 'ECU', category: 'Eletrônica', price: 1300, image: '🖥️' },
        { id: 12, name: 'Fazer 250 Corrente de Transmissão', category: 'Fazer', price: 700, image: '🔗' },
        { id: 13, name: 'Espelho Retrovisor', category: 'Acessórios', price: 240, image: '🪞' },
        { id: 14, name: 'Kit Filtro de Ar Premium', category: 'Genérico', price: 259, image: '🌫️' },
        { id: 15, name: 'Filtro de Combustível', category: 'Genérico', price: 80, image: '⛽' },
        { id: 16, name: 'Filtro de Óleo', category: 'Genérico', price: 50, image: '💧' },
        { id: 17, name: 'Kit Pastilha de Freio', category: 'Freios', price: 320, image: '🛑' }
      ]);

      const [cart, setCart] = useState(() => {
        const saved = localStorage.getItem('yamaha_cart');
        return saved ? JSON.parse(saved) : [];
      });

      const [showCart, setShowCart] = useState(false);
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('Todos');
      const [showCheckout, setShowCheckout] = useState(false);
      const [formData, setFormData] = useState({ name: '', email: '', phone: '', address: '' });

      useEffect(() => {
        localStorage.setItem('yamaha_cart', JSON.stringify(cart));
      }, [cart]);

      const categories = ['Todos', ...new Set(products.map(p => p.category))];
      const filteredProducts = products.filter(p => 
        (selectedCategory === 'Todos' || p.category === selectedCategory) &&
        p.name.toLowerCase().includes(searchTerm.toLowerCase())
      );

      const addToCart = (product) => {
        const existing = cart.find(item => item.id === product.id);
        if (existing) {
          setCart(cart.map(item => 
            item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item
          ));
        } else {
          setCart([...cart, { ...product, quantity: 1 }]);
        }
      };

      const removeFromCart = (productId) => {
        setCart(cart.filter(item => item.id !== productId));
      };

      const updateQuantity = (productId, quantity) => {
        if (quantity <= 0) {
          removeFromCart(productId);
        } else {
          setCart(cart.map(item => 
            item.id === productId ? { ...item, quantity } : item
          ));
        }
      };

      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);

      const handleCheckout = () => {
        if (!formData.name || !formData.email || !formData.phone || !formData.address) {
          alert('Preencha todos os campos!');
          return;
        }
        const message = `*Novo Pedido Yamaha Peças* 🏍️\n\n👤 *Cliente:* ${formData.name}\n📧 *Email:* ${formData.email}\n📱 *Tel:* ${formData.phone}\n📍 *Endereço:* ${formData.address}\n\n*PRODUTOS:*\n${cart.map(item => `• ${item.name}\n  Qtd: ${item.quantity} | R$ ${(item.price * item.quantity).toFixed(2)}`).join('\n')}\n\n💰 *TOTAL: R$ ${totalPrice.toFixed(2)}*\n\n⏳ Frete será cotado após confirmação.`;
        const whatsappUrl = `https://wa.me/5511987654321?text=${encodeURIComponent(message)}`;
        window.open(whatsappUrl, '_blank');
        setCart([]);
        setShowCheckout(false);
        setFormData({ name: '', email: '', phone: '', address: '' });
        alert('✅ Pedido enviado! Você receberá uma confirmação em breve.');
      };

      return (
        <div className="min-h-screen bg-gradient-to-b from-neutral-50 to-neutral-100">
          {/* HEADER */}
          <header className="sticky top-0 z-40 bg-white shadow-sm border-b-4 border-red-600">
            <div className="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 bg-gradient-to-br from-red-600 to-red-700 rounded-full flex items-center justify-center text-white font-bold text-lg">Y</div>
                <div>
                  <h1 className="text-xl font-bold text-gray-900">Yamaha Peças</h1>
                  <p className="text-xs text-gray-500">Peças Originais e Acessórios</p>
                </div>
              </div>
              
              <div className="flex-1 mx-4 hidden md:block">
                <div className="relative">
                  <input
                    type="text"
                    placeholder="Buscar peças..."
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    className="w-full pl-4 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-red-600 focus:ring-1 focus:ring-red-600"
                  />
                </div>
              </div>

              <button
                onClick={() => setShowCart(!showCart)}
                className="relative p-3 hover:bg-red-50 rounded-lg transition-colors"
              >
                <svg className="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                </svg>
                {totalItems > 0 && (
                  <span className="absolute -top-2 -right-2 bg-red-600 text-white text-xs font-bold w-6 h-6 rounded-full flex items-center justify-center animate-pulse">
                    {totalItems}
                  </span>
                )}
              </button>
            </div>
          </header>

          {/* MOBILE SEARCH */}
          <div className="md:hidden px-4 py-3 bg-white border-b">
            <input
              type="text"
              placeholder="Buscar peças..."
              value={searchTerm}
              onChange={(e) => setSearchTerm(e.target.value)}
              className="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm"
            />
          </div>

          <div className="max-w-7xl mx-auto px-4 py-8">
            {/* CATEGORIAS */}
            <div className="mb-8">
              <h2 className="text-sm font-semibold text-gray-600 mb-3 uppercase tracking-wider">Categorias</h2>
              <div className="flex gap-2 overflow-x-auto pb-2">
                {categories.map(cat => (
                  <button
                    key={cat}
                    onClick={() => setSelectedCategory(cat)}
                    className={`px-4 py-2 rounded-full whitespace-nowrap font-medium transition-all ${
                      selectedCategory === cat
                        ? 'bg-red-600 text-white shadow-lg scale-105'
                        : 'bg-white text-gray-700 border border-gray-200 hover:border-red-600'
                    }`}
                  >
                    {cat}
                  </button>
                ))}
              </div>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
              {filteredProducts.map(product => (
                <div
                  key={product.id}
                  className="bg-white rounded-xl shadow-md hover:shadow-xl transition-all duration-300 overflow-hidden border border-gray-100 hover:border-red-300 group"
                >
                  <div className="bg-gradient-to-br from-gray-100 to-gray-50 p-8 flex items-center justify-center h-40 text-6xl group-hover:scale-110 transition-transform">
                    {product.image}
                  </div>
                  
                  <div className="p-6">
                    <h3 className="font-semibold text-gray-900 mb-1 line-clamp-2 text-sm">{product.name}</h3>
                    <p className="text-xs text-gray-500 mb-4">{product.category}</p>
                    
                    <div className="flex items-baseline gap-1 mb-4">
                      <span className="text-3xl font-bold text-red-600">R$ {product.price.toLocaleString('pt-BR')}</span>
                    </div>

                    <button
                      onClick={() => addToCart(product)}
                      className="w-full bg-gradient-to-r from-red-600 to-red-700 text-white font-semibold py-3 rounded-lg hover:shadow-lg hover:from-red-700 hover:to-red-800 transition-all active:scale-95"
                    >
                      Adicionar ao Carrinho
                    </button>
                  </div>
                </div>
              ))}
            </div>

            {filteredProducts.length === 0 && (
              <div className="text-center py-12">
                <p className="text-gray-500 text-lg">Nenhuma peça encontrada</p>
              </div>
            )}
          </div>

          {/* CARRINHO SIDEBAR */}
          {showCart && (
            <div className="fixed inset-0 z-50 overflow-hidden">
              <div className="absolute inset-0 bg-black bg-opacity-50" onClick={() => setShowCart(false)} />
              
              <div className="absolute right-0 top-0 h-full w-full max-w-md bg-white shadow-xl flex flex-col animate-in slide-in-from-right">
                <div className="flex items-center justify-between p-6 border-b border-gray-200">
                  <h2 className="text-xl font-bold text-gray-900">Seu Carrinho</h2>
                  <button onClick={() => setShowCart(false)} className="p-1 hover:bg-gray-100 rounded-lg">
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                    </svg>
                  </button>
                </div>

                {cart.length === 0 ? (
                  <div className="flex-1 flex items-center justify-center">
                    <p className="text-gray-500">Carrinho vazio</p>
                  </div>
                ) : (
                  <>
                    <div className="flex-1 overflow-y-auto p-6 space-y-4">
                      {cart.map(item => (
                        <div key={item.id} className="flex gap-4 pb-4 border-b">
                          <div className="text-4xl">{item.image}</div>
                          <div className="flex-1">
                            <p className="font-semibold text-sm text-gray-900 line-clamp-2">{item.name}</p>
                            <p className="text-red-600 font-bold text-sm mt-1">R$ {item.price.toLocaleString('pt-BR')}</p>
                            <div className="flex items-center gap-2 mt-2">
                              <button
                                onClick={() => updateQuantity(item.id, item.quantity - 1)}
                                className="w-6 h-6 border border-gray-300 rounded hover:bg-gray-100 text-sm"
                              >
                                −
                              </button>
                              <span className="w-6 text-center text-sm font-medium">{item.quantity}</span>
                              <button
                                onClick={() => updateQuantity(item.id, item.quantity + 1)}
                                className="w-6 h-6 border border-gray-300 rounded hover:bg-gray-100 text-sm"
                              >
                                +
                              </button>
                              <button
                                onClick={() => removeFromCart(item.id)}
                                className="ml-auto text-red-600 hover:bg-red-50 px-2 py-1 rounded text-xs font-medium"
                              >
                                Remover
                              </button>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>

                    <div className="border-t p-6 space-y-4">
                      <div className="flex justify-between items-center">
                        <span className="text-gray-600">Total:</span>
                        <span className="text-2xl font-bold text-red-600">R$ {totalPrice.toLocaleString('pt-BR')}</span>
                      </div>
                      <button
                        onClick={() => {
                          setShowCart(false);
                          setShowCheckout(true);
                        }}
                        className="w-full bg-red-600 text-white font-bold py-3 rounded-lg hover:bg-red-700 transition-colors"
                      >
                        Finalizar Compra
                      </button>
                    </div>
                  </>
                )}
              </div>
            </div>
          )}

          {/* CHECKOUT MODAL */}
          {showCheckout && (
            <div className="fixed inset-0 z-50 flex items-center justify-center overflow-y-auto">
              <div className="absolute inset-0 bg-black bg-opacity-50" onClick={() => setShowCheckout(false)} />
              
              <div className="relative bg-white rounded-2xl shadow-2xl max-w-md w-full mx-4 p-8 zoom-in-95">
                <button
                  onClick={() => setShowCheckout(false)}
                  className="absolute right-4 top-4 p-1 hover:bg-gray-100 rounded-lg"
                >
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                  </svg>
                </button>

                <h2 className="text-2xl font-bold text-gray-900 mb-6">Finalizar Compra</h2>

                <div className="space-y-4 mb-6">
                  <input
                    type="text"
                    placeholder="Seu Nome"
                    value={formData.name}
                    onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-red-600"
                  />
                  <input
                    type="email"
                    placeholder="Email"
                    value={formData.email}
                    onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-red-600"
                  />
                  <input
                    type="tel"
                    placeholder="Telefone/WhatsApp"
                    value={formData.phone}
                    onChange={(e) => setFormData({ ...formData, phone: e.target.value })}
                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-red-600"
                  />
                  <textarea
                    placeholder="Endereço completo"
                    value={formData.address}
                    onChange={(e) => setFormData({ ...formData, address: e.target.value })}
                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-red-600 resize-none h-24"
                  />
                </div>

                <div className="bg-gray-50 p-4 rounded-lg mb-6">
                  <div className="flex justify-between mb-2">
                    <span className="text-gray-600">Subtotal:</span>
                    <span className="font-semibold">R$ {totalPrice.toLocaleString('pt-BR')}</span>
                  </div>
                  <div className="flex justify-between text-lg font-bold border-t pt-2">
                    <span>Total:</span>
                    <span className="text-red-600">R$ {totalPrice.toLocaleString('pt-BR')}</span>
                  </div>
                  <p className="text-xs text-gray-500 mt-2">* Frete será cotado após confirmação</p>
                </div>

                <button
                  onClick={handleCheckout}
                  className="w-full bg-gradient-to-r from-red-600 to-red-700 text-white font-bold py-3 rounded-lg hover:shadow-lg transition-all mb-3"
                >
                  ✅ Confirmar via WhatsApp
                </button>
                
                <button
                  onClick={() => setShowCheckout(false)}
                  className="w-full border border-gray-300 text-gray-700 font-semibold py-3 rounded-lg hover:bg-gray-50 transition-colors"
                >
                  Continuar Comprando
                </button>
              </div>
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<YamahaMarketplace />);
  </script>
</body>
</html>
